[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-engine"
version = "1.0.0"
description = "Multi-Agent AI System for Automated System Design and Engineering Analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Mackenzie Campbel Andross", email = "mackenzieandross@gmail.com" }
]
keywords = [
    "multi-agent",
    "software-architecture",
    "system-design",
    "langgraph",
    "threat-modeling",
    "stride",
    "engineering-analysis"
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "fastapi>=0.163.1",
    "uvicorn[standard]>=0.28.0",
    "langgraph>=0.0.20",
    "langchain-core>=0.1.30",
    "google-genai>=1.0.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "mlflow>=2.10.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "httpx>=0.26.0"
]

[project.scripts]
forge = "scripts.run_forge:main"
forge-benchmark = "scripts.run_benchmark:main"

[tool.setuptools.packages.find]
include = ["forge*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "UP042", # Class inherits from both str and Enum
]

[tool.mypy]
python_version = "3.11"
files = ["forge"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
