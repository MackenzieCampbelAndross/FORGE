name: Bug Report
description: Create a report to help us improve FORGE
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug in FORGE!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug encountered during execution.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact CLI command, scenario ID, or API payload to reproduce.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output (secrets are auto-redacted).
      render: shell
