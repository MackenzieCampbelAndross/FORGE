name: Feature Request
description: Suggest an idea or enhancement for FORGE
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Pitch a new feature, agent capability, or benchmark scenario for FORGE.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the engineering problem.
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of the proposed feature or agent behavior.
    validations:
      required: true
