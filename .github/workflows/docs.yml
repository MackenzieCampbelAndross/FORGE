name: Documentation & Schema Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    name: Docs & Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate dataset schemas
        run: python scripts/validate_dataset.py

      - name: Test example inputs
        run: |
          python scripts/run_forge.py --input examples/healthcare.json --output-dir outputs/ci_test
