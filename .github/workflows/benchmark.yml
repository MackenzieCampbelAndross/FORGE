name: Benchmark Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    name: FEB v1.0 Benchmark Suite Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate FEB v1.0 dataset integrity
        run: python scripts/validate_dataset.py

      - name: Execute benchmark sample run (10 scenarios)
        run: |
          python scripts/run_benchmark.py --limit 10 --export-json outputs/ci_benchmark.json --export-csv outputs/ci_benchmark.csv

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: outputs/ci_benchmark.*
